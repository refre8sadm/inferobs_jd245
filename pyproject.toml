[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "refre8sadm-inferobs_jd245"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出模型服务可观测性工程师·重排模型的候选截断上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "refre8sadm" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://refre8sadm.github.io"
Repository = "https://github.com/refre8sadm/inferobs_jd245"
Issues = "https://github.com/refre8sadm/inferobs_jd245/issues"

[project.scripts]
inferobs_jd245 = "inferobs_jd245:main"

[tool.setuptools]
py-modules = ["inferobs_jd245"]
